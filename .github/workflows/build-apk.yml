name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK components
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT}"
          SDKMGR=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager missing, installing cmdline-tools"
            mkdir -p /tmp/cmdline-tools
            curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q -o /tmp/cmdtools.zip -d /tmp/cmdline-tools
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            cp -r /tmp/cmdline-tools/cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"
            SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -n 20
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV

      - name: Local properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          cat local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Show build environment
        run: |
          ./gradlew --version

      - name: Build with Gradle
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          set -e
          TASK_TYPE=$(echo "$BUILD_TYPE" | sed 's/^./\U&/')
          echo "Running :app:assemble$TASK_TYPE"
          ./gradlew ":app:assemble$TASK_TYPE" --no-daemon --stacktrace \
            -Dorg.gradle.configuration-cache=false

      - name: Locate APK artifacts
        id: apk
        run: |
          set -e
          mapfile -t FILES < <(find app/build/outputs/apk -name '*.apk' -type f | sort)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No APK produced"
            find app/build/outputs -maxdepth 4 -type f 2>/dev/null || true
            exit 1
          fi
          mkdir -p dist
          for f in "${FILES[@]}"; do cp "$f" "dist/$(basename "$f")"; done
          ls -la dist
          for f in dist/*.apk; do
            echo "== $f =="
            echo "size: $(stat -c%s "$f") bytes"
            sha256sum "$f"
          done
          echo "apk_count=${#FILES[@]}" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperTV-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Job summary
        run: |
          {
            echo "## HyperTV APK build"
            echo ""
            echo "- Type: \`${{ github.event.inputs.build_type || 'release' }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- APKs: ${{ steps.apk.outputs.apk_count }}"
            echo ""
            echo "| file | bytes | sha256 |"
            echo "| --- | --- | --- |"
            for f in dist/*.apk; do
              echo "| $(basename "$f") | $(stat -c%s "$f") | $(sha256sum "$f" | cut -d' ' -f1) |"
            done
          } >> $GITHUB_STEP_SUMMARY
