name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platforms & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Show build environment
        run: |
          ./gradlew --version
          echo "BUILD_TYPE=${{ github.event.inputs.build_type || 'release' }}" >> $GITHUB_ENV

      - name: Build with Gradle
        run: |
          ./gradlew :app:assemble${BUILD_TYPE^} --no-daemon --stacktrace \
            -Porg.gradle.configuration-cache=false

      - name: Locate APK artifacts
        id: apk
        run: |
          set -e
          mapfile -t FILES < <(find app/build/outputs/apk -name '*.apk' -type f | sort)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          mkdir -p dist
          for f in "${FILES[@]}"; do
            base=$(basename "$f")
            cp "$f" "dist/$base"
          done
          ls -la dist
          for f in dist/*.apk; do
            echo "== $f =="
            echo "size: $(stat -c%s "$f") bytes"
            echo "sha256: $(sha256sum "$f" | cut -d' ' -f1)"
          done
          echo "apk_count=${#FILES[@]}" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperTV-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Job summary
        run: |
          {
            echo "## HyperTV APK build"
            echo ""
            echo "- Build type: \`${{ github.event.inputs.build_type || 'release' }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- APKs produced: ${{ steps.apk.outputs.apk_count }}"
            echo ""
            echo "| file | size (bytes) | sha256 |"
            echo "| --- | --- | --- |"
            for f in dist/*.apk; do
              echo "| $(basename "$f") | $(stat -c%s "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
          } >> $GITHUB_STEP_SUMMARY
